# ==============================================================
#  AgentGuard — Application Properties
# ==============================================================

# ── Server ───────────────────────────────────────────────────
server.port=8080

# ── H2 In-Memory Database (default for dev / testing) ────────
spring.datasource.url=jdbc:h2:mem:agentguarddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console — access at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── MySQL (uncomment the block below to switch from H2) ──────
